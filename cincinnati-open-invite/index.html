  <title>Glean at the Cincinnati Open Party — Executive Suite Invitation</title>
  <meta name="description" content="Executive Suite Invitation for Glean at the Cincinnati Open." />
  <style>
    :root {
      --artifact-bg: #07122b;
      --artifact-text: #ffffff;
      --artifact-shadow: 0 24px 60px rgba(0,0,0,0.34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, rgba(52,60,237,0.24), transparent 24%),
        linear-gradient(145deg, #09122b 0%, #0c1d47 42%, #081124 100%);
      color: var(--artifact-text);
      font-family: Inter, Arial, sans-serif;
    }
    .frame {
      width: min(96vw, 980px);
    }
    .invite-link {
      display: block;
      line-height: 0;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--artifact-shadow);
      text-decoration: none;
    }
    .invite-image {
      display: block;
      width: 100%;
      height: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media print {
      body {
        margin: 0;
        padding: 0.35in;
        background: #fff;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .frame { width: 100% !important; }
      .invite-link { box-shadow: none !important; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
