name: split-hr-video
on:
  push:
    branches: [hr-video-source-split]
    paths: ['.github/workflows/split-hr-video.yml']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hr-video-source-split
      - name: Split
        run: |
          set -e
          SRC=borgwarner-hr-video-v2
          OUT=_split/$SRC
          mkdir -p $OUT
          cat $SRC/part-0{1..8}.b64 | tr -d ' \n\r\t' > /tmp/all.b64
          split -b 700000 -d -a 2 /tmp/all.b64 $OUT/p
          for f in $OUT/p??; do mv "$f" "$f.txt"; done
          base64 -d /tmp/all.b64 > /tmp/video.mp4
          echo "{\"b64_chars\": $(wc -c < /tmp/all.b64), \"mp4_bytes\": $(wc -c < /tmp/video.mp4), \"sha256\": \"$(sha256sum /tmp/video.mp4 | cut -d' ' -f1)\", \"pieces\": $(ls $OUT/p*.txt | wc -l)}" > $OUT/manifest.json
          cat $OUT/manifest.json
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add _split
          git commit -m "Split HR v2 video into 700k pieces"
          git push
